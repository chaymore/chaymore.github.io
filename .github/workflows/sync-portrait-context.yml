name: Sync portrait context

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync explicitly public Drive pages
        run: node scripts/sync-portrait-context.mjs
        env:
          DRIVE_WIKI_FOLDER_ID: ${{ secrets.DRIVE_WIKI_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PORTRAIT_SYNC_URL: ${{ secrets.PORTRAIT_SYNC_URL }}
          PORTRAIT_SYNC_TOKEN: ${{ secrets.PORTRAIT_SYNC_TOKEN }}
